name: Deploy PENNIES CHEQ to Base Mainnet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Deploy
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          forge create src/PenniesCheq.sol:PenniesCheq \
            --rpc-url https://mainnet.base.org \
            --private-key "$PRIVATE_KEY" \
            --broadcast
      - name: Output address
        run: |
          echo "PENNIES CHEQ deployed at:"
          cat broadcast/**/run-latest.json | jq -r '.transactions[] | select(.transactionType=="CREATE") .contractAddress'
