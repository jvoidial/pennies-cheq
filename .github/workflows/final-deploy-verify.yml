name: Final Deploy & Verify PENNIES CHEQ

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Deploy
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          forge create src/PenniesCheqV2.sol:PenniesCheq \
            --rpc-url https://mainnet.base.org \
            --private-key "$PRIVATE_KEY" \
            --broadcast 2>&1 | tee deploy.txt
          ADDR=$(grep -oP 'Deployed to: \K0x[a-fA-F0-9]{40}' deploy.txt)
          echo "FINAL_ADDR=$ADDR" >> $GITHUB_ENV
          echo "Deployed to: $ADDR"
      - name: Verify
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          FINAL_ADDR: ${{ env.FINAL_ADDR }}
        run: |
          forge verify-contract "$FINAL_ADDR" \
            src/PenniesCheqV2.sol:PenniesCheq \
            --chain base \
            --compiler-version v0.8.20+commit.a1b79de6 \
            --optimizer-runs 200 \
            --etherscan-api-key "$ETHERSCAN_API_KEY" \
            --watch
