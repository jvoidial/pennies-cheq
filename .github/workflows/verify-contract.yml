name: Verify PENNIES CHEQ (Standard JSON with IR)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit verification via standard JSON
        env:
          API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          # Read the contract source from the repo
          SOURCE=$(cat src/PenniesCheq.sol | jq -Rs .)  # JSON-encode the source string

          # Build the standard JSON input with viaIR=true and optimizer settings
          JSON_PAYLOAD=$(jq -n \
            --argjson src "$SOURCE" \
            '{
              "language": "Solidity",
              "sources": {
                "PenniesCheq.sol": {
                  "content": $src
                }
              },
              "settings": {
                "optimizer": {
                  "enabled": true,
                  "runs": 200
                },
                "viaIR": true,
                "evmVersion": "paris",
                "outputSelection": {
                  "*": {
                    "*": ["evm.bytecode.object", "abi"]
                  }
                }
              }
            }' | jq -c .)

          # Submit verification via the API
          RESPONSE=$(curl -s -X POST "https://api.basescan.org/v2/api" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: application/json" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "apikey=$API_KEY" \
            --data-urlencode "module=contract" \
            --data-urlencode "action=verifysourcecode" \
            --data-urlencode "contractaddress=0x2a92CAA3b01E64634e2E95AA533a5570a76c19A7" \
            --data-urlencode "sourceCode=$JSON_PAYLOAD" \
            --data-urlencode "codeformat=solidity-standard-json-input" \
            --data-urlencode "contractname=PenniesCheq" \
            --data-urlencode "compilerversion=v0.8.35+commit.8a20c2bb" \
            --data-urlencode "optimizationUsed=1" \
            --data-urlencode "runs=200" \
            --data-urlencode "licenseType=3" \
            --data-urlencode "constructorArguements=")

          echo "API response: $RESPONSE"

          if echo "$RESPONSE" | jq -e '.status == "1" and .message == "OK"' > /dev/null; then
            echo "✅ Verification submitted successfully!"
          else
            echo "❌ Verification failed: $RESPONSE"
            exit 1
          fi
