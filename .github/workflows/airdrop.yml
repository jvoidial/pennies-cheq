name: Airdrop All Three Tokens

on:
  workflow_dispatch:

jobs:
  airdrop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Send Airdrops
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          RECIPIENTS=$(cat airdrop-addresses.json | jq -r '.recipients[]')
          
          for RECIPIENT in $RECIPIENTS; do
            echo "🎁 Sending to $RECIPIENT..."
            
            # Send 100 SGUIDE (100 * 10^18)
            cast send 0xb50DCEb0570557B9B7FE43D8cBDc9B3457D3dc5a \
              "transfer(address,uint256)" $RECIPIENT 100000000000000000000 \
              --rpc-url https://mainnet.base.org --private-key "$PRIVATE_KEY" --legacy
            echo "  ✅ 100 SGUIDE sent"
            
            # Send 100 VDOO
            cast send 0x38e4f08D08b4D772A7B75669C356b4749dd2d30b \
              "transfer(address,uint256)" $RECIPIENT 100000000000000000000 \
              --rpc-url https://mainnet.base.org --private-key "$PRIVATE_KEY" --legacy
            echo "  ✅ 100 VDOO sent"
            
            # Send 100 PENNIES CHEQ
            cast send 0x2a92CAA3b01E64634e2E95AA533a5570a76c19A7 \
              "transfer(address,uint256)" $RECIPIENT 100000000000000000000 \
              --rpc-url https://mainnet.base.org --private-key "$PRIVATE_KEY" --legacy
            echo "  ✅ 100 PENNIES CHEQ sent"
          done
          
          echo "✅ Airdrop complete!"
