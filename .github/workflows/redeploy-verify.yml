name: Redeploy & Verify PENNIES CHEQ

on:
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Deploy new PENNIES CHEQ (verifiable)
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          echo ">>> Deploying new PENNIES CHEQ with verifiable compiler..."
          forge create src/PenniesCheq.sol:PenniesCheq \
            --rpc-url https://mainnet.base.org \
            --private-key "$PRIVATE_KEY" \
            --broadcast 2>&1 | tee deploy_output.txt
          ADDR=$(grep -oP 'Deployed to: \K0x[a-fA-F0-9]{40}' deploy_output.txt)
          echo "NEW_ADDR=$ADDR" >> $GITHUB_ENV
          echo "New contract deployed at: $ADDR"

      - name: Transfer tokens from old contract to new
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          echo ">>> Transferring all tokens to new contract..."
          # Transfer all 990T tokens from deployer to new contract
          cast send 0x2a92CAA3b01E64634e2E95AA533a5570a76c19A7 \
            "transfer(address,uint256)" "${{ env.NEW_ADDR }}" \
            990000000000000000000000000000000 \
            --rpc-url https://mainnet.base.org \
            --private-key "$PRIVATE_KEY" \
            --legacy
          echo "Tokens transferred to new contract."

      - name: Verify new contract on BaseScan
        env:
          NEW_ADDR: ${{ env.NEW_ADDR }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          echo ">>> Verifying new contract..."
          forge verify-contract "$NEW_ADDR" \
            src/PenniesCheq.sol:PenniesCheq \
            --chain base \
            --compiler-version 0.8.35+commit.47b9dedd \
            --optimizer-runs 200 \
            --etherscan-api-key "$ETHERSCAN_API_KEY" \
            --watch

      - name: Output new address
        run: |
          echo "✅ New PENNIES CHEQ deployed & verified!"
          echo "   New address: ${{ env.NEW_ADDR }}"
          echo "   Old address: 0x2a92CAA3b01E64634e2E95AA533a5570a76c19A7 (now empty)"
          echo "   Verify: https://basescan.org/address/${{ env.NEW_ADDR }}#code"
