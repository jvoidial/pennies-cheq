name: Transfer PENNIES CHEQ to Base Wallet

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Transfer all tokens
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          cast send 0x2a92CAA3b01E64634e2E95AA533a5570a76c19A7 \
            "transfer(address,uint256)" 0xA7AE3C7b8e539447094b0Bb517F60EaBcf6bCddF \
            1000000000000000000000000000000000 \
            --rpc-url https://mainnet.base.org \
            --private-key "$PRIVATE_KEY" \
            --legacy
      - name: Confirm transfer
        run: echo "Tokens sent to 0xA7AE3C7b8e539447094b0Bb517F60EaBcf6bCddF"
